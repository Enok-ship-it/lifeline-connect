<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — LifeLine Connect</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 26 32%27%3E%3Cpath d=%27M13 0C13 0 25 16.5 25 23C25 29 19.6 32 13 32C6.4 32 1 29 1 23C1 16.5 13 0 13 0Z%27 fill=%27%23B91C3C%27/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="index.html" class="nav-logo"><span class="dot"></span> LifeLine Connect</a>
    <ul class="nav-links"></ul>
    <div class="nav-actions">
      <a href="register.html" class="btn btn-primary">Join now</a>
    </div>
  </div>
</nav>

<div class="blob-bg" style="min-height: calc(100vh - 72px); display:flex; align-items:center;">
  <div class="particles"></div>
  <div class="auth-wrap glass-card tilt reveal">
    <h1>Welcome back</h1>
  <p>Log in to view matches, respond to requests, or manage your dashboard.</p>

  <div class="form-error" id="formError"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required />
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
  </form>

  <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
  <p class="form-hint" style="text-align:center; margin-top:16px;">
    Demo login (after running the seed script): rohan@example.com / password123
  </p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/effects.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
