<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — LifeLine Connect</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="index.html" class="nav-logo"><span class="dot"></span> LifeLine Connect</a>
    <ul class="nav-links"></ul>
    <div class="nav-actions">
      <a href="register.html" class="btn btn-primary">Join now</a>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <h1>Welcome back</h1>
  <p>Log in to view matches, respond to requests, or manage your dashboard.</p>

  <div class="form-error" id="formError"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required />
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
  </form>

  <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
  <p class="form-hint" style="text-align:center; margin-top:16px;">
    Demo login (after running the seed script): rohan@example.com / password123
  </p>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
